# Executes the example notebooks in docs/, builds the Sphinx documentation from
# them (`tox -e docu`, see pyproject.toml) and deploys the result to GitHub
# Pages. On pull requests the notebooks are executed and the docs are built,
# but nothing is deployed.
# API keys come from repository secrets (Settings > Secrets and variables >
# Actions, e.g. KNMI_OPENDATA_API_KEY and KNMI_EDR_API_KEY); GitHub masks secret
# values in logs and knmidata never prints them. On forks (no secrets) the
# examples fall back to the anonymous Open Data key and skip the EDR section,
# so the workflow still passes.
name: Build and Deploy Docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/documentation.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/documentation.yml"
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. However, do NOT cancel in-progress runs as we
# want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv with Python 3.13
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install package and notebook tooling
        run: |
          uv venv
          uv pip install -e ".[notebooks]" python-dotenv
          uv pip install tox-uv

      - name: Execute example notebooks
        env:
          KNMI_OPENDATA_API_KEY: ${{ secrets.KNMI_OPENDATA_API_KEY }}
          KNMI_EDR_API_KEY: ${{ secrets.KNMI_EDR_API_KEY }}
        run: |
          for f in docs/example_*.ipynb; do
            echo "::group::Executing $f"
            jupyter nbconvert --to notebook --execute --inplace "$f"
            echo "::endgroup::"
          done

      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: docs/example_*.ipynb
          if-no-files-found: ignore

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Set up tox environment
        run: |
          uv run tox -e docu --notest

      - name: Build documentation
        run: |
          uv run tox -e docu --skip-pkg-install

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    # Deploy only from the default branch, not from pull requests.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
