name: Tests

on:
  - push
  - pull_request

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Test suite with py311-ubuntu
            python: "3.11"
            os: ubuntu-latest
            toxenv: py311
            experimental: false
          - name: Test suite with py314-ubuntu
            python: "3.14"
            os: ubuntu-latest
            toxenv: py314
            experimental: false
          # - name: Test suite with py315-ubuntu
          #   python: "3.15"
          #   os: ubuntu-latest
          #   toxenv: py315
          #   experimental: true
          - name: Type checking with ty
            python: "3.13"
            os: ubuntu-latest
            toxenv: typety
            experimental: false
          - name: Formatting and linting with ruff
            python: "3.13"
            os: ubuntu-latest
            toxenv: ruff
            experimental: false

    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv with Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv
          uv pip install tox-uv

      - name: Setup tox environment
        run: uv run tox -e ${{ matrix.toxenv }} --notest

      - name: Test
        run: uv run tox -e ${{ matrix.toxenv }} --skip-pkg-install
