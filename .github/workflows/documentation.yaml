# Executes the example notebooks in docs/, builds the Sphinx documentation from
# them (`tox -e docu`, see pyproject.toml) and deploys the result to GitHub
# Pages. Main branch builds are deployed to the site root and pull-request
# builds are deployed to public preview URLs under /pr-<number>/.
# Configure Pages to "Deploy from a branch" and use the gh-pages branch.
# A root .nojekyll marker is required so assets in underscored paths (for
# example _static/) are served for both main and PR preview pages.
# API keys come from repository secrets (Settings > Secrets and variables >
# Actions, e.g. KNMI_OPENDATA_API_KEY and KNMI_EDR_API_KEY); GitHub masks secret
# values in logs and knmidata never prints them. On forks (no secrets) the
# examples fall back to the anonymous Open Data key and skip the EDR section,
# so the workflow still passes.
name: Build and Deploy Docs

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. However, do NOT cancel in-progress runs as we
# want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv with Python 3.13
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install tox
        run: |
          uv venv
          uv pip install tox-uv

      - name: Set up tox environment for notebook execution
        run: |
          uv run tox -e notebooks --notest

      - name: Execute example notebooks
        env:
          KNMI_OPENDATA_API_KEY: ${{ secrets.KNMI_OPENDATA_API_KEY }}
          KNMI_EDR_API_KEY: ${{ secrets.KNMI_EDR_API_KEY }}
        run: |
          uv run tox -e notebooks --skip-pkg-install

      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: executed-notebooks
          path: docs/example_*.ipynb
          if-no-files-found: ignore

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Set up tox environment for documentation build
        run: |
          uv run tox -e docu --notest

      - name: Build documentation
        run: |
          uv run tox -e docu --skip-pkg-install

      - name: Add .nojekyll marker
        run: |
          touch docs/_build/html/.nojekyll

      - name: Upload built docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: built-docs
          path: docs/_build/html
          if-no-files-found: error

  deploy-main:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7

      - name: Download built docs artifact
        uses: actions/download-artifact@v8
        with:
          name: built-docs
          path: docs/_build/html

      - name: Deploy docs to site root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/_build/html
          clean: true
          clean-exclude: |
            pr-*

  deploy-pr-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download built docs artifact
        uses: actions/download-artifact@v8
        with:
          name: built-docs
          path: docs/_build/html

      - name: Create root .nojekyll marker payload
        run: |
          mkdir -p .pages-root
          touch .pages-root/.nojekyll

      - name: Ensure root .nojekyll exists on gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .pages-root
          clean: false

      - name: Deploy PR docs preview
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/_build/html
          target-folder: pr-${{ github.event.pull_request.number }}
          clean: true

      - name: Add public PR docs URL to check summary
        run: |
          echo "## PR docs preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Open docs preview](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/)" >> "$GITHUB_STEP_SUMMARY"
