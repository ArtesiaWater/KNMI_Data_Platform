[build-system]
requires = ["uv_build>=0.8.0"]
build-backend = "uv_build"

[project]
name = "knmidata"
version = "0.0.1"
description = "Python client for the KNMI Data Platform with native xarray support."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11, <3.16"
authors = [
    { name = "Martin Vonk", email = "m.vonk@artesia-water.nl" },
    { name = "Onno Ebbens", email = "o.ebbens@artesia-water.nl" },
    { name = "Ruben Caljé", email = "r.calje@artesia-water.nl" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27.0", "xarray>=2024.1.0", "h5netcdf>=1.3.0"]

[project.optional-dependencies]
testing = ["pytest", "pytest-asyncio", "pytest-cov", "respx", "ruff", "ty"]
dev = ["knmidata[testing]", "pre-commit", "tox-uv>=1.0"]

[tool.uv.build-backend]
source-include = ["tests/**"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov=pestpysuite --cov-report=term-missing"

[tool.ruff]
extend-include = ["*.ipynb"]
lint.extend-select = ["I", "D"]
lint.pydocstyle.convention = "numpy"
lint.ignore = ["B023"]
show-fixes = true
fix = true

[tool.ty.src]
exclude = ["tests/**", "docs/**"]

[tool.tox]
requires = ["tox-uv>=1.0"]
env_list = ["py311", "py315", "ruff", "typety"]

[tool.tox.env_run_base]
description = "run unit tests"
extras = ["testing"]
commands = [["pytest", "tests"]]

[tool.tox.env.typety]
description = "run type checks with ty"
extras = ["testing"]
commands = [["ty", "check", "src"]]

[tool.tox.env.ruff]
description = "run format and lint checks with ruff"
extras = ["testing"]
commands = [
    [
        "ruff",
        "check",
        "--extend-select",
        "I",
    ],
    [
        "ruff",
        "format",
        "--check",
    ],
]

[tool.tox.env.docs]
description = "build documentation"
extras = ["docs"]
commands = [["sphinx-build", "-b", "html", "docs", "docs/_build/html"]]
